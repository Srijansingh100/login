<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <style>
      input {
        height: 32px;
        width: 260px;
        font-size: 17px;
      }

      button {
        height: 32px;
        width: 260px;
        font-size: 17px;
        border-radius: 5px;
        border: none;
        background-color: grey;
        color: white;
      }

      form {
        border: 1px solid black;
        width: 70%;
        height: 220px;
        border-radius: 20px;
      }
    </style>
  </head>

  <body>
    <center>
      <h2>Login</h2>

      <form>
        <br /><br />

        <input type="text" placeholder="Enter username or email" />

        <br /><br />

        <input type="password" placeholder="Password" />

        <br /><br />

        <button type="submit">Login</button>
      </form>
    </center>
  </body>
</html>
